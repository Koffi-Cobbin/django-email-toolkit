[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-email-toolkit"
version = "0.1.0"
description = "Reusable Django transactional email helpers: activation links, password resets, and templated sends — with sane env-var config and optional Celery support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
celery = ["celery>=5.2"]
dev = ["pytest", "pytest-django"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_toolkit = ["templates/email_toolkit/*.txt"]
